[package]
name = "audio-transcribe-service"
version = "0.1.0"
edition = "2021"
description = "HTTP front for the resident audio-transcribe ASR worker (short requests)"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "io-util",
    "sync",
    "time",
    "signal",
] }

[[bin]]
name = "audio-transcribe-service"
path = "src/main.rs"
