version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      development-tools:
        patterns:
          - mypy
          - pip-audit
          - pytest
          - pytest-cov
          - ruff
          - types-*
      ml-stack:
        patterns:
          - mlx-whisper
          - pyannote-*
          - torch*
          - transformers
          - whisperx
    ignore:
      # Numba 0.66 requires NumPy <2.5.
      - dependency-name: numpy
        versions: [">=2.5"]
      # WhisperX 3.8 requires the Torch 2.8 / TorchCodec 0.7 stack.
      - dependency-name: torch
        versions: [">=2.9"]
      - dependency-name: torchaudio
        versions: [">=2.9"]
      - dependency-name: torchcodec
        versions: [">=0.8"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
