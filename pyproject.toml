[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-transcribe"
version = "0.5.0"
description = "Local audio transcription pipeline for structured meeting notes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1.0,<2.5",
    "pyyaml>=6.0.3,<7",
    "rich>=15.0.0,<16",
    "typer>=0.26.8,<0.27",
]

[project.optional-dependencies]
mlx = [
    "mlx-whisper>=0.4.3,<0.5",
    "numba>=0.66.0",
    # mlx currently reuses WhisperX audio loading and alignment.
    "torch>=2.8.0,<2.9",
    "torchaudio>=2.8.0,<2.9",
    "torchcodec>=0.7.0,<0.8",
    "whisperx>=3.8.6,<3.9",
]
whisperx = [
    "torch>=2.8.0,<2.9",
    "torchaudio>=2.8.0,<2.9",
    "torchcodec>=0.7.0,<0.8",
    "whisperx>=3.8.6,<3.9",
]
diarization = [
    "torch>=2.8.0,<2.9",
    "torchaudio>=2.8.0,<2.9",
    "torchcodec>=0.7.0,<0.8",
    "whisperx>=3.8.6,<3.9",
]
ml = [
    "mlx-whisper>=0.4.3,<0.5",
    "numba>=0.66.0",
    "torch>=2.8.0,<2.9",
    "torchaudio>=2.8.0,<2.9",
    "torchcodec>=0.7.0,<0.8",
    "whisperx>=3.8.6,<3.9",
]

[project.urls]
Homepage = "https://github.com/shared-goals/audio-transcribe"
Repository = "https://github.com/shared-goals/audio-transcribe"
Issues = "https://github.com/shared-goals/audio-transcribe/issues"

[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.1",
    "idna>=3.15",
    "mako>=1.3.12",
    "nltk>=3.9.4",
    "numba>=0.66.0",
    "pillow>=12.2.0",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]

[project.scripts]
audio-transcribe = "audio_transcribe.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.15.21,<0.16",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "ANN"]
ignore = ["ANN401"]  # Any is needed for untyped ML libraries (whisperx, torch)

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
"audio_transcribe/cli.py" = ["B008"]  # typer.Argument/Option in defaults is idiomatic

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["mlx.*", "mlx_whisper.*", "pyannote.*", "torch.*", "whisperx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
markers = [
    "ml_smoke: opt-in tests that load real ML backends and may download models",
]

[tool.hatch.build.targets.wheel]
packages = ["audio_transcribe"]

[tool.hatch.build.targets.sdist]
include = [
    "/audio_transcribe",
    "/examples",
    "/scripts/audio-transcribe-worker.sh",
    "/scripts/com.gnezim.audio-transcribe-worker.plist.template",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
    "/install.sh",
    "/pyproject.toml",
    "/uv.lock",
]

# Setup:
#   uv sync
#   export HF_TOKEN=hf_...
#
# Diarization requires a HuggingFace token with pyannote licenses accepted:
#   https://huggingface.co/pyannote/speaker-diarization-3.1
#   https://huggingface.co/pyannote/speaker-diarization-community-1
#
# M4 note: float16 crashes with ctranslate2 — always use int8:
#   whisperx.load_model("large-v3", device="cpu", compute_type="int8")
